name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gcc
            compiler: g++
            sanitizer: ""
          - name: clang
            compiler: clang++
            sanitizer: ""
          - name: ubsan
            compiler: g++
            sanitizer: undefined
          - name: asan
            compiler: g++
            sanitizer: address
    name: Host ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-System
          path: deps/EDP-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTypes
          path: deps/EDP-BoundedTypes
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform
          path: deps/EDP-Platform
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Memory
          path: deps/EDP-Memory
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTopology
          path: deps/EDP-BoundedTopology
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform-Portable
          path: deps/EDP-Platform-Portable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Localisation
          path: deps/EDP-Localisation
      - name: Host contracts
        env:
          CXX: ${{ matrix.compiler }}
          EDP_SERIALISATION_SANITIZER_MODE: ${{ matrix.sanitizer }}
          EDP_SYSTEM_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-System
          EDP_BOUNDED_TYPES_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-BoundedTypes
          EDP_PLATFORM_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-Platform
          EDP_MEMORY_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-Memory
          EDP_BOUNDED_TOPOLOGY_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-BoundedTopology
          EDP_PLATFORM_PORTABLE_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-Platform-Portable
          EDP_LOCALISATION_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-Localisation
        run: ./tests/run_host_tests.sh

  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-System
          path: deps/EDP-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTypes
          path: deps/EDP-BoundedTypes
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform
          path: deps/EDP-Platform
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Memory
          path: deps/EDP-Memory
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTopology
          path: deps/EDP-BoundedTopology
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform-Portable
          path: deps/EDP-Platform-Portable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Localisation
          path: deps/EDP-Localisation
      - name: Configure and execute CMake host target
        run: >-
          cmake -S tests -B tests/.cmake-build
          -DEDP_SYSTEM_SOURCE_DIR=${{ github.workspace }}/deps/EDP-System
          -DEDP_BOUNDED_TYPES_SOURCE_DIR=${{ github.workspace }}/deps/EDP-BoundedTypes
          -DEDP_PLATFORM_SOURCE_DIR=${{ github.workspace }}/deps/EDP-Platform
          -DEDP_MEMORY_SOURCE_DIR=${{ github.workspace }}/deps/EDP-Memory
          -DEDP_BOUNDED_TOPOLOGY_SOURCE_DIR=${{ github.workspace }}/deps/EDP-BoundedTopology
          -DEDP_PLATFORM_PORTABLE_SOURCE_DIR=${{ github.workspace }}/deps/EDP-Platform-Portable
          -DEDP_LOCALISATION_SOURCE_DIR=${{ github.workspace }}/deps/EDP-Localisation
          && cmake --build tests/.cmake-build --parallel 2
          && tests/.cmake-build/EDP_Serialisation_HostTests
      - name: Verify and execute README round-trip example
        run: |
          python3 tests/verify_readme_example.py
          cmake -S examples/json-numeric-round-trip/Portable_CMake \
                -B "${{ runner.temp }}/edp-serialisation-json-round-trip" \
                -DEDP_SYSTEM_SOURCE_DIR=${{ github.workspace }}/deps/EDP-System \
                -DEDP_BOUNDED_TYPES_SOURCE_DIR=${{ github.workspace }}/deps/EDP-BoundedTypes \
                -DEDP_PLATFORM_SOURCE_DIR=${{ github.workspace }}/deps/EDP-Platform \
                -DEDP_MEMORY_SOURCE_DIR=${{ github.workspace }}/deps/EDP-Memory \
                -DEDP_BOUNDED_TOPOLOGY_SOURCE_DIR=${{ github.workspace }}/deps/EDP-BoundedTopology \
                -DEDP_PLATFORM_PORTABLE_SOURCE_DIR=${{ github.workspace }}/deps/EDP-Platform-Portable \
                -DEDP_LOCALISATION_SOURCE_DIR=${{ github.workspace }}/deps/EDP-Localisation
          cmake --build "${{ runner.temp }}/edp-serialisation-json-round-trip" --parallel 2
          "${{ runner.temp }}/edp-serialisation-json-round-trip/EDP_Serialisation_JsonNumericRoundTrip"

  pioarduino-projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - demos/type-qualification/PlatformIO_Arduino
          - demos/type-qualification/PlatformIO_ESP-IDF
          - demos/json-numeric-encoding/PlatformIO_Arduino
          - demos/json-numeric-encoding/PlatformIO_ESP-IDF
          - demos/json-numeric-decoding/PlatformIO_Arduino
          - demos/json-numeric-decoding/PlatformIO_ESP-IDF
          - demos/json-typed-envelope/PlatformIO_Arduino
          - demos/json-typed-envelope/PlatformIO_ESP-IDF
          - demos/json-localised-text/PlatformIO_Arduino
          - demos/json-localised-text/PlatformIO_ESP-IDF
          - demos/cbor-numeric/PlatformIO_Arduino
          - demos/cbor-numeric/PlatformIO_ESP-IDF
          - examples/json-numeric-round-trip/PlatformIO_Arduino
          - examples/json-numeric-round-trip/PlatformIO_ESP-IDF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install current PIOArduino Core
        run: |
          python3 -m pip install uv
          curl -fsSL -o get-platformio.py https://raw.githubusercontent.com/pioarduino/pioarduino-core-installer/pioarduino/get-platformio.py
          python3 get-platformio.py
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"
      - name: Build project
        run: pio run -d "${{ matrix.project }}"
