name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gcc
            compiler: g++
            sanitizer: ""
          - name: clang
            compiler: clang++
            sanitizer: ""
          - name: ubsan
            compiler: g++
            sanitizer: undefined
          - name: asan
            compiler: g++
            sanitizer: address
    name: Host ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-System
          path: deps/EDP-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTypes
          path: deps/EDP-BoundedTypes
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform
          path: deps/EDP-Platform
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Memory
          path: deps/EDP-Memory
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTopology
          path: deps/EDP-BoundedTopology
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform-Portable
          path: deps/EDP-Platform-Portable
      - name: Host contracts
        env:
          CXX: ${{ matrix.compiler }}
          EDP_SERIALISATION_SANITIZER_MODE: ${{ matrix.sanitizer }}
          EDP_SYSTEM_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-System
          EDP_BOUNDED_TYPES_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-BoundedTypes
          EDP_PLATFORM_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-Platform
          EDP_MEMORY_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-Memory
          EDP_BOUNDED_TOPOLOGY_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-BoundedTopology
          EDP_PLATFORM_PORTABLE_SOURCE_DIR: ${{ github.workspace }}/deps/EDP-Platform-Portable
        run: ./tests/run_host_tests.sh

  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-System
          path: deps/EDP-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTypes
          path: deps/EDP-BoundedTypes
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform
          path: deps/EDP-Platform
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Memory
          path: deps/EDP-Memory
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTopology
          path: deps/EDP-BoundedTopology
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform-Portable
          path: deps/EDP-Platform-Portable
      - name: Configure and execute CMake host target
        run: >-
          cmake -S tests -B tests/.cmake-build
          -DEDP_SYSTEM_SOURCE_DIR=${{ github.workspace }}/deps/EDP-System
          -DEDP_BOUNDED_TYPES_SOURCE_DIR=${{ github.workspace }}/deps/EDP-BoundedTypes
          -DEDP_PLATFORM_SOURCE_DIR=${{ github.workspace }}/deps/EDP-Platform
          -DEDP_MEMORY_SOURCE_DIR=${{ github.workspace }}/deps/EDP-Memory
          -DEDP_BOUNDED_TOPOLOGY_SOURCE_DIR=${{ github.workspace }}/deps/EDP-BoundedTopology
          -DEDP_PLATFORM_PORTABLE_SOURCE_DIR=${{ github.workspace }}/deps/EDP-Platform-Portable
          && cmake --build tests/.cmake-build --parallel 2
          && tests/.cmake-build/EDP_Serialisation_HostTests

  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - run: pio run -d demos/type-qualification/PlatformIO_Arduino
      - run: pio run -d demos/type-qualification/PlatformIO_ESP-IDF
      - run: pio run -d demos/json-numeric-encoding/PlatformIO_Arduino
      - run: pio run -d demos/json-numeric-encoding/PlatformIO_ESP-IDF
